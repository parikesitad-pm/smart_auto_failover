[package]
name = "smart-auto-failover-core"
version = "3.0.0"
description = "AutoFailover 3.0 Native Engine by Modula"
authors = ["parikesitad-pm"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "shell-open" ] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
