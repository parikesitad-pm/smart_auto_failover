[package]
name = "rust-core"
version = "3.0.0"
description = "Authoritative network resilience and failover engine for AutoFailover 3.0 by Modula"
authors = ["parikesitad-pm"]
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
